[project]
name = "book-companion-backend"
version = "0.1.0"
description = "Book Companion FastAPI backend"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "gunicorn>=22.0,<24.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "boto3>=1.34,<2.0",
    "python-json-logger>=2.0,<4.0",
    "pyjwt[crypto]>=2.8,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
# Agent-tier dependencies. Installed into the agent images and the MCP server
# image, NOT the FastAPI application image (keeps the API image lean).
agents = [
    "langgraph>=0.2,<1.0",
    "bedrock-agentcore>=0.1,<1.0",
    "pypdf>=4.2,<6.0",
    "mcp>=1.2,<2.0",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "boto3-stubs[dynamodb,s3,sqs]>=1.34,<2.0",
    # Agent deps are needed locally to run and test the agent pipeline.
    "langgraph>=0.2,<1.0",
    "bedrock-agentcore>=0.1,<1.0",
    "pypdf>=4.2,<6.0",
    "mcp>=1.2,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = ["B008"]  # FastAPI uses function calls in argument defaults (Depends)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["src"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

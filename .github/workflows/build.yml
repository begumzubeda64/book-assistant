name: Build & Push Images

# Builds all five container images (API, MCP tool server, and the three isolated
# agents), security-scans them with Trivy, and pushes to ECR via OIDC.
#
# AWS steps are gated on the AWS_ROLE_ARN repository variable, so the build +
# scan still run (and gate merges) even before AWS is configured; the push only
# happens once the OIDC role exists.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for AWS OIDC

env:
  AWS_REGION: eu-central-1

jobs:
  build:
    name: Build, scan, push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: backend/Dockerfile
            repo: book-companion-api
          - name: mcp
            dockerfile: backend/Dockerfile.mcp
            repo: book-companion-mcp
          - name: agent-ingestion
            dockerfile: backend/agents/Dockerfile.ingestion
            repo: book-companion-agent-ingestion
          - name: agent-adaptive
            dockerfile: backend/agents/Dockerfile.adaptive_reading
            repo: book-companion-agent-adaptive
          - name: agent-discussion
            dockerfile: backend/agents/Dockerfile.discussion
            repo: book-companion-agent-discussion
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -f "${{ matrix.dockerfile }}" \
            -t "${{ matrix.name }}:${{ github.sha }}" backend

      # Run Trivy via its official container with a pinned version instead of
      # the aquasecurity/trivy-action GitHub Action. The action's version tags
      # were force-pushed to malware during a 2026-03 supply-chain compromise
      # (GHSA-69fq-xp46-6x23), and the old pin (0.28.0) no longer resolves.
      # Invoking the pinned image directly avoids the action's tag surface
      # entirely and matches how the scan is validated locally.
      - name: Trivy scan (fail on HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.67.0 image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --ignorefile /.trivyignore \
            --format table \
            "${{ matrix.name }}:${{ github.sha }}"

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag & push to ECR
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${{ matrix.repo }}"
          docker tag "${{ matrix.name }}:${{ github.sha }}" "$IMAGE:${{ github.sha }}"
          docker tag "${{ matrix.name }}:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
